name: Android Release Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (${{ matrix.ndk_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let other architectures finish if one fails
      matrix:
        include:
          # 64-bit ARM (Standard for 99% of modern Android devices & Termux)
          - target: aarch64-linux-android
            ndk_arch: arm64-v8a
          # 32-bit ARM (Older Android devices)
          - target: armv7-linux-androideabi
            ndk_arch: armeabi-v7a
          # 64-bit x86 (Android Emulators / ChromeOS)
          - target: x86_64-linux-android
            ndk_arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-ndk
        run: cargo binstall -y cargo-ndk

      - name: Build binaries with Android NDK
        # We explicitly build both the router and the wizard web server.
        # RUSTFLAGS strips debug symbols, reducing the file sizes by ~70%.
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: >
          cargo ndk 
          --target ${{ matrix.ndk_arch }} 
          --platform 24 
          build --release --bin xrouter --bin xrouter-wizard-server

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrouter-android-${{ matrix.ndk_arch }}
          path: |
            target/${{ matrix.target }}/release/xrouter
            target/${{ matrix.target }}/release/xrouter-wizard-server
          if-no-files-found: error
