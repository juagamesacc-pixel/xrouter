name: Android Release Builds

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (${{ matrix.ndk_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Let other architectures finish if one fails
      matrix:
        include:
          - target: aarch64-linux-android
            ndk_arch: arm64-v8a
          - target: armv7-linux-androideabi
            ndk_arch: armeabi-v7a
          - target: x86_64-linux-android
            ndk_arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk (Fast via binstall)
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y cargo-ndk

      - name: Build binary with Android NDK
        # C-dependencies (ring, zstd-sys) require the Android NDK C-compiler.
        # cargo-ndk handles exporting CC, AR, and CXX automatically.
        # API 24 (Android 7.0) is the minimum baseline for modern Termux.
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: >
          cargo ndk 
          -t ${{ matrix.ndk_arch }} 
          -p 24 
          build --release --package xrouter-cli --bin xrouter

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrouter-android-${{ matrix.ndk_arch }}
          path: target/${{ matrix.target }}/release/xrouter
          if-no-files-found: error
