[package]
name = "xrouter-wizard"
version = "0.1.0"
edition = "2021"
description = "Premium web-based setup wizard for xrouter — self-contained HTML templates"

# This crate is part of the xrouter workspace so it can reuse xrouter-auth
# (which uses `workspace = true` deps) for the device-login flow. It is still
# spawned as a separate `xrouter wizard --web` process on :3001 so it is never
# linked into the xrouter-server hot path.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
xrouter-auth = { path = "../xrouter-auth" }
tokio = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }

[[bin]]
name = "xrouter-wizard-server"
path = "src/main.rs"
