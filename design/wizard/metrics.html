<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xrouter metrics</title>
<style>
:root{
  --bg:#06060a;--bg2:#0d0d14;--bg3:#15151e;--bg4:#1e1e2a;
  --surface:rgba(20,20,32,.72);--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --fg:#eaeaef;--fg2:#a0a0ae;--fg3:#66667a;
  --accent:#7c6aff;--accent2:#a094ff;--accent3:#5b47e0;
  --green:#34d399;--red:#f87171;--amber:#fbbf24;
  --radius:16px;--radius-sm:12px;--radius-xs:8px;
  --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"SF Mono","Cascadia Code","Fira Code","JetBrains Mono",Consolas,monospace;
  --ease:cubic-bezier(.4,0,.2,1);--ease-b:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);color:var(--fg);min-height:100vh;line-height:1.6;overflow-x:hidden;position:relative}

/* ══ Aurora / Mesh animated gradient ══ */
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:linear-gradient(145deg,#06060a 0%,#0a0a18 40%,#0e0c1e 100%)}
body::after{content:"";position:fixed;inset:-50%;z-index:-1;
  background:
    radial-gradient(ellipse 45% 55% at 25% 15%,rgba(124,106,255,.16),transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%,rgba(52,211,153,.08),transparent 55%),
    radial-gradient(ellipse 40% 50% at 50% 90%,rgba(168,85,247,.10),transparent 55%),
    radial-gradient(ellipse 55% 35% at 10% 75%,rgba(251,191,36,.05),transparent 50%);
  animation:auroraShift 18s ease-in-out infinite alternate}
@keyframes auroraShift{
  0%{transform:translate(0%,0%) rotate(0deg) scale(1)}
  33%{transform:translate(3%,-2%) rotate(1deg) scale(1.02)}
  66%{transform:translate(-2%,3%) rotate(-0.5deg) scale(1.01)}
  100%{transform:translate(1%,-1%) rotate(0.5deg) scale(1)}}

/* ══ Noise ══ */
.noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

.container{max-width:960px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1}

/* ══ Glass ══ */
.glass{background:var(--surface);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
  border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.25);transition:border-color .3s,box-shadow .3s}
.glass:hover{border-color:var(--border2)}

h1{font-size:1.7rem;font-weight:800;letter-spacing:-.04em;
  background:linear-gradient(135deg,var(--fg) 30%,var(--accent2) 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:4px;animation:fadeUp .6s var(--ease) both}
.sub{color:var(--fg3);font-size:.85rem;margin-bottom:28px;animation:fadeUp .6s var(--ease) .05s both}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px;animation:fadeUp .6s var(--ease) .1s both}
.card{background:rgba(20,20,32,.5);backdrop-filter:blur(8px);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:18px;text-align:center;transition:border-color .25s}
.card:hover{border-color:var(--border2)}
.card .val{font-size:1.8rem;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.card .lbl{font-size:.72rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.06em}

.chart-box{background:rgba(20,20,32,.5);backdrop-filter:blur(8px);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:20px;animation:fadeUp .5s var(--ease) both}
.chart-box canvas{width:100%!important;height:280px!important}
.chart-title{font-size:.88rem;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}

/* ══ Legend for multi-line chart ══ */
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.chart-legend .leg-item{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--fg2)}
.chart-legend .leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ══ Tooltip ══ */
.chart-tooltip{position:absolute;background:rgba(12,12,20,.94);backdrop-filter:blur(12px);border:1px solid var(--border2);
  border-radius:var(--radius-xs);padding:8px 12px;font-size:.78rem;color:var(--fg);pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50;display:none;white-space:nowrap;
  font-family:var(--mono);line-height:1.5}

/* ══ Table ══ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:20px;
  animation:fadeUp .5s var(--ease) .15s both}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;padding:10px 14px;color:var(--fg3);font-weight:500;border-bottom:2px solid var(--border);
  font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--border)}
tr:hover td{background:rgba(124,106,255,.03)}
.ok{color:var(--green);font-weight:600}.err{color:var(--red);font-weight:600}
.code-ref{font-family:var(--mono);font-size:.78rem;color:var(--fg3);background:rgba(30,30,46,.6);padding:2px 6px;border-radius:4px}

/* ══ Error code reference panel ══ */
.ref-panel{background:rgba(20,20,32,.5);backdrop-filter:blur(8px);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:16px;margin-bottom:20px;animation:fadeUp .5s var(--ease) .2s both}
.ref-panel h3{font-size:.88rem;font-weight:700;margin-bottom:10px}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ref-item{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(10,10,16,.4);
  border-radius:6px;font-size:.8rem;border:1px solid rgba(255,255,255,.03)}
.ref-code{font-family:var(--mono);font-weight:700;color:var(--accent2);min-width:32px}
.ref-str{color:var(--fg2);flex:1}
.ref-desc{color:var(--fg3);font-size:.72rem}

/* ══ Modal ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(4,4,8,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .2s var(--ease)}
.modal-overlay.hidden{display:none}
.modal{background:rgba(16,16,26,.95);backdrop-filter:blur(24px);border:1px solid var(--border2);
  border-radius:var(--radius);padding:32px;max-width:440px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.6);
  animation:scaleIn .25s var(--ease-b) both}
.modal h3{font-size:1.15rem;font-weight:700;margin-bottom:6px}
.modal .modal-sub{color:var(--fg3);font-size:.85rem;margin-bottom:16px}
.modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ══ Toast ══ */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;background:rgba(16,16,26,.9);backdrop-filter:blur(16px);
  border:1px solid var(--green);border-radius:var(--radius-sm);color:var(--green);font-size:.85rem;font-weight:500;
  box-shadow:0 8px 32px rgba(0,0,0,.4);z-index:1000;animation:fadeUp .3s var(--ease-b) both;display:none}
.toast.error{border-color:var(--red);color:var(--red)}.toast.show{display:flex;align-items:center;gap:8px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;font-size:.85rem;font-weight:600;font-family:var(--font);
  border:none;border-radius:var(--radius-xs);cursor:pointer;transition:all .2s var(--ease)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-secondary{background:rgba(30,30,46,.8);color:var(--fg2);border:1.5px solid var(--border)}
.btn-secondary:hover{background:rgba(40,40,56,.9);border-color:var(--border2);color:var(--fg)}
.btn-sm{padding:7px 14px;font-size:.82rem}

.empty{text-align:center;padding:60px 20px;color:var(--fg3);animation:fadeUp .6s var(--ease) both}
.empty svg{width:56px;height:56px;stroke:var(--bg4);margin-bottom:16px}
.empty p{font-size:.88rem}

@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}.container{padding:24px 16px}.ref-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="container">
  <h1>xrouter metrics</h1>
  <p class="sub">Live performance dashboard — auto-refreshes every 5s</p>
  <div class="grid" id="cards"></div>
  <div class="chart-box" id="latencyBox" style="position:relative">
    <div class="chart-title">Latency (ms) over time — per provider</div>
    <canvas id="cLatency"></canvas>
    <div class="chart-legend" id="latencyLegend"></div>
    <div class="chart-tooltip" id="latencyTooltip"></div>
  </div>
  <div class="chart-box" style="position:relative">
    <div class="chart-title">Error rate over time</div>
    <canvas id="cError"></canvas>
    <div class="chart-tooltip" id="errorTooltip"></div>
  </div>
  <div class="chart-box" style="position:relative">
    <div class="chart-title">Requests per second</div>
    <canvas id="cRps"></canvas>
    <div class="chart-tooltip" id="rpsTooltip"></div>
  </div>
  <div class="ref-panel">
    <h3>Error Code Reference</h3>
    <div class="ref-grid" id="refGrid"></div>
  </div>
  <div class="table-wrap">
    <table><thead><tr><th>Time</th><th>Tier</th><th>Provider</th><th>Model</th><th>Status</th><th>Code</th><th>Latency</th><th>Key</th><th>Error</th></tr></thead>
    <tbody id="tbody"></tbody></table>
  </div>
  <div style="text-align:center;margin-top:16px"><button class="btn btn-secondary btn-sm" id="refreshBtn">↻ Refresh now</button></div>
</div>
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal"><h3 id="modalTitle"></h3><p class="modal-sub" id="modalSub"></p><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const ERROR_CODES={400:'bad_request',401:'authentication_error',403:'permission_denied',404:'not_found_error',408:'timeout',409:'conflict',422:'validation_error',429:'quota_exceeded',500:'internal_error',502:'upstream_down',503:'overloaded_error',504:'upstream_timeout'};
const PROVIDER_COLORS=['#7c6aff','#34d399','#f87171','#fbbf24','#a78bfa','#f472b6','#38bdf8','#fb923c'];

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(msg,err){const el=document.getElementById('toast');el.textContent=(err?'✕ ':'✔ ')+msg;el.className='toast show'+(err?' error':'');setTimeout(()=>el.classList.remove('show'),3000)}
function showModal({title,sub,bodyHTML,actions}){const o=document.getElementById('modalOverlay');document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalSub').textContent=sub||'';document.getElementById('modalBody').innerHTML=bodyHTML||'';
  const ab=document.getElementById('modalActions');ab.innerHTML='';
  actions.forEach(({label,cls,cb})=>{const b=document.createElement('button');b.className='btn '+(cls||'btn-secondary');b.textContent=label;
    b.addEventListener('click',()=>{cb();o.classList.add('hidden')});ab.appendChild(b)});
  o.classList.remove('hidden')}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modalOverlay').classList.add('hidden')});

/* ══ Error code reference ══ */
const ERROR_REF=[
  {code:400,str:'bad_request',desc:'Malformed request body or missing required fields'},
  {code:401,str:'authentication_error',desc:'Invalid or missing API key'},
  {code:403,str:'permission_denied',desc:'Key lacks required permissions'},
  {code:404,str:'not_found_error',desc:'Unknown tier or endpoint'},
  {code:408,str:'timeout',desc:'Upstream request timed out'},
  {code:409,str:'conflict',desc:'Request conflicts with current state'},
  {code:422,str:'validation_error',desc:'Request body failed validation'},
  {code:429,str:'quota_exceeded',desc:'Rate limit / quota exceeded (triggers ban)'},
  {code:500,str:'internal_error',desc:'Router internal failure'},
  {code:502,str:'upstream_down',desc:'Upstream provider unreachable'},
  {code:503,str:'overloaded_error',desc:'All providers in tier exhausted'},
  {code:504,str:'upstream_timeout',desc:'Upstream timed out after failover'},
];
function renderRefGrid(){
  const g=document.getElementById('refGrid');g.innerHTML='';
  ERROR_REF.forEach(r=>{const d=document.createElement('div');d.className='ref-item';
    d.innerHTML=`<span class="ref-code">${r.code}</span><span class="ref-str">${r.str}</span><span class="ref-desc">${r.desc}</span>`;g.appendChild(d)})
}

/* ══ Chart drawing ══ */
function setupCanvas(id){
  const c=document.getElementById(id);if(!c)return null;
  const ctx=c.getContext('2d'),dpr=devicePixelRatio||1,r=c.parentElement.getBoundingClientRect();
  c.width=r.width*dpr;c.height=280*dpr;c.style.width=r.width+'px';c.style.height='280px';ctx.scale(dpr,dpr);
  return{ctx,W:r.width,H:280,pad:{t:20,r:20,b:30,l:55},c,r,cW:r.width-75,cH:280-50}}

function drawGrid(ctx,W,H,pad,mx,cH){
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const y=pad.t+(cH/5)*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#66667a';ctx.font='10px system-ui';ctx.textAlign='right';ctx.fillText((mx-(mx/5)*i).toFixed(0),pad.l-8,y+3)}
}

function drawSingleLine(ctx,vals,n,pad,cW,cH,mx,stroke,fill){
  ctx.beginPath();ctx.moveTo(pad.l,pad.t+cH);
  vals.forEach((v,i)=>{const x=pad.l+(n>1?(cW/(n-1))*i:cW/2),y=pad.t+cH-(v/mx)*cH;ctx.lineTo(x,y)});
  ctx.lineTo(pad.l+cW,pad.t+cH);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);g.addColorStop(0,fill);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();vals.forEach((v,i)=>{const x=pad.l+(n>1?(cW/(n-1))*i:cW/2),y=pad.t+cH-(v/mx)*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
  const lx=pad.l+(n>1?cW:cW/2),ly=pad.t+cH-(vals[n-1]/mx)*cH;
  ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);ctx.fillStyle=stroke;ctx.fill();
  ctx.beginPath();ctx.arc(lx,ly,7,0,Math.PI*2);ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.globalAlpha=.25;ctx.stroke();ctx.globalAlpha=1}

function drawTimeLabels(ctx,pts,pad,cW,H,maxLen){
  if(maxLen>1){ctx.fillStyle='#66667a';ctx.font='10px system-ui';ctx.textAlign='center';
    const step=Math.max(1,Math.floor(maxLen/7));
    for(let i=0;i<maxLen;i+=step){const x=pad.l+(cW/(maxLen-1))*i;ctx.fillText(String(pts[i]?.t||pts[i]?.time||i).slice(-6),x,H-8)}}
}

function drawSingleChart(id,pts,stroke,fill){
  const s=setupCanvas(id);if(!s)return;const{ctx,W,H,pad,cW,cH,c}=s;ctx.clearRect(0,0,W,H);
  if(!pts.length){ctx.fillStyle='#66667a';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('Awaiting data…',W/2,H/2);return}
  const vals=pts.map(p=>typeof p==='number'?p:(p.v||p.y||0)),mx=Math.max(...vals)*1.15||1,n=vals.length;
  drawGrid(ctx,W,H,pad,mx,cH);drawTimeLabels(ctx,pts,pad,cW,H,n);drawSingleLine(ctx,vals,n,pad,cW,cH,mx,stroke,fill);
  c.addEventListener('mousemove',e=>{
    const rect=c.getBoundingClientRect();const mx2=rect.width-75;
    const relX=e.clientX-rect.left-pad.l;
    const idx=Math.round(relX/(mx2/(n-1)));if(idx<0||idx>=n){tooltip.style.display='none';return}
    const v=vals[idx];const t=pts[idx]?.t||pts[idx]?.time||idx;
    tooltip.innerHTML=`<strong>${esc(String(t))}</strong><br>${v.toFixed(1)} ms`;
    tooltip.style.display='block';tooltip.style.left=(e.clientX-rect.left+12)+'px';tooltip.style.top=(e.clientY-rect.top-30)+'px'});
  c.addEventListener('mouseleave',()=>{tooltip.style.display='none'});
  var tooltip=c.parentElement.querySelector('.chart-tooltip')}

function drawMultiLineChart(id,providerData){
  const s=setupCanvas(id);if(!s)return;const{ctx,W,H,pad,cW,cH,c}=s;ctx.clearRect(0,0,W,H);
  const providers=Object.keys(providerData);
  if(!providers.length){ctx.fillStyle='#66667a';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('Awaiting data…',W/2,H/2);return}
  let allVals=[];providers.forEach(k=>{const arr=providerData[k]||[];allVals=allVals.concat(arr.map(v=>typeof v==='number'?v:(v.value||v.y||0)))});
  if(!allVals.length){ctx.fillStyle='#66667a';ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillText('No data yet',W/2,H/2);return}
  const mx=Math.max(...allVals)*1.15||1,maxLen=Math.max(...providers.map(k=>(providerData[k]||[]).length))||1;
  drawGrid(ctx,W,H,pad,mx,cH);drawTimeLabels(ctx,providerData[providers[0]]||[],pad,cW,H,maxLen);
  providers.forEach((pk,pi)=>{
    const pts=providerData[pk]||[];const vals=pts.map(v=>typeof v==='number'?v:(v.value||v.y||0));const color=PROVIDER_COLORS[pi%PROVIDER_COLORS.length];
    const n=vals.length;
    ctx.beginPath();vals.forEach((v,i)=>{const x=pad.l+(n>1?(cW/(n-1))*i:cW/2),y=pad.t+cH-(v/mx)*cH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.stroke();
    if(n>1){const lx=pad.l+(cW/(n-1))*(n-1),ly=pad.t+cH-(vals[n-1]/mx)*cH;ctx.beginPath();ctx.arc(lx,ly,3.5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}});
  const leg=document.getElementById('latencyLegend');leg.innerHTML='';
  providers.forEach((pk,pi)=>{const color=PROVIDER_COLORS[pi%PROVIDER_COLORS.length];
    const d=document.createElement('div');d.className='leg-item';d.innerHTML=`<span class="leg-dot" style="background:${color}"></span>${esc(pk)}`;leg.appendChild(d)});
  c.addEventListener('mousemove',e=>{
    const rect=c.getBoundingClientRect();const mx2=rect.width-75;const relX=e.clientX-rect.left-pad.l;
    let closest=null,minDist=Infinity;
    providers.forEach((pk,pi)=>{const pts=providerData[pk]||[];const vals=pts.map(v=>typeof v==='number'?v:(v.value||v.y||0));const n=vals.length;
      const idx=Math.round(relX/(mx2/(n-1)));if(idx<0||idx>=n)return;
      const dist=Math.abs(relX-(mx2/(n-1))*idx);if(dist<minDist){minDist=dist;closest={provider:pk,value:vals[idx],time:pts[idx]?.t||pts[idx]?.time||idx,color:PROVIDER_COLORS[pi%PROVIDER_COLORS.length]}}});
    if(closest){tooltip.innerHTML=`<strong style="color:${closest.color}">● ${esc(closest.provider)}</strong><br>${String(closest.time).slice(-6)} — ${closest.value.toFixed(1)} ms`;
      tooltip.style.display='block';tooltip.style.left=(e.clientX-rect.left+12)+'px';tooltip.style.top=(e.clientY-rect.top-36)+'px'}
    else{tooltip.style.display='none'}});
  c.addEventListener('mouseleave',()=>{tooltip.style.display='none'});
  var tooltip=c.parentElement.querySelector('.chart-tooltip')}

/* ══ Load metrics ══ */
async function load(){
  try{
    const r=await fetch('/admin/metrics');if(!r.ok)return;const d=await r.json();
    const cards=document.getElementById('cards');
    cards.innerHTML=[
      {l:'Total Requests',v:d.total||0,c:'var(--accent2)'},
      {l:'Avg Latency',v:d.avg_latency_ms?d.avg_latency_ms.toFixed(0)+'ms':'—',c:'var(--green)'},
      {l:'P99 Latency',v:d.p99_latency_ms?d.p99_latency_ms.toFixed(0)+'ms':'—',c:'var(--amber)'},
      {l:'Error Rate',v:d.total?((d.error_count||0)/d.total*100).toFixed(1)+'%':'—',c:(d.error_count||0)>0?'var(--red)':'var(--green)'},
      {l:'RPS',v:d.rps?d.rps.toFixed(1):'—',c:'var(--accent2)'},
    ].map(s=>`<div class="card"><div class="lbl">${s.l}</div><div class="val" style="color:${s.c}">${s.v}</div></div>`).join('');
    drawMultiLineChart('cLatency',d.provider_latency||{});
    drawSingleChart('cError',d.error_timeline||[],'var(--red)','rgba(248,113,113,.12)');
    drawSingleChart('cRps',d.rps_timeline||[],'var(--green)','rgba(52,211,153,.12)');
    const tb=document.getElementById('tbody');tb.innerHTML='';
    (d.recent||[]).slice(0,100).forEach(e=>{
      const codeStr=ERROR_CODES[e.status]||'unknown';
      tb.innerHTML+=`<tr><td style="font-family:var(--mono);font-size:.78rem;white-space:nowrap">${esc(e.time||'')}</td>
        <td>${esc(e.tier||'')}</td><td>${esc(e.provider||'')}</td><td style="font-family:var(--mono);font-size:.8rem">${esc(e.model||'')}</td>
        <td class="${e.status>=400?'err':'ok'}">${e.status||'—'}</td>
        <td><span class="code-ref">${esc(codeStr)}</span></td>
        <td style="font-family:var(--mono)">${e.latency_ms?e.latency_ms.toFixed(0)+'ms':'—'}</td>
        <td style="font-size:.78rem;color:var(--fg3)">${e.key_idx!=null?'#'+e.key_idx:'—'}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg3)">${esc(e.error||'')}</td></tr>`;
    });
  }catch{toast('Failed to load metrics',true)}
}

document.getElementById('refreshBtn').addEventListener('click',load);
renderRefGrid();load();setInterval(load,5000);
</script>
</body>
</html>
