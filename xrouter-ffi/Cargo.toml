[package]
name = "xrouter-ffi"
version = "0.1.0"
edition = "2021"
description = "JNI + C FFI bridge for xrouter HTTP proxy server"

[lib]
name = "xrouter_ffi"
crate-type = ["cdylib"]

[dependencies]
xrouter-core = { path = "../crates/xrouter-core" }
xrouter-config = { path = "../crates/xrouter-config" }
xrouter-balancer = { path = "../crates/xrouter-balancer" }
xrouter-providers = { path = "../crates/xrouter-providers" }
xrouter-server = { path = "../crates/xrouter-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
socket2 = "0.5"
axum = "0.7"
once_cell = "1"
dirs = "5"
anyhow = "1"
toml = "0.8"
jni = { version = "0.21", features = ["invocation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
